name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: huddlemark_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d huddlemark_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/huddlemark_ci
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret-1234
      CRON_SECRET: ci-only-cron-secret
      USE_MARKET_FIXTURES: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Prepare PostgreSQL runtime database
        run: npm run db:push:ci
      - name: Verify auth and real live NFL data
        env:
          USE_MARKET_FIXTURES: "false"
          NODE_ENV: "production"
          LYNERVA_SMOKE_BASE_URL: "http://127.0.0.1:3000"
        run: |
          npm start > /tmp/lynerva-next.log 2>&1 &
          SERVER_PID=$!
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/live-nfl > /dev/null; then
              break
            fi
            sleep 1
          done
          npm run smoke:auth || {
            cat /tmp/lynerva-next.log
            kill $SERVER_PID || true
            exit 1
          }
          npm run smoke:live || {
            cat /tmp/lynerva-next.log
            kill $SERVER_PID || true
            exit 1
          }
          kill $SERVER_PID || true

  build_without_runtime_env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build with no runtime secrets
        run: npm run build
