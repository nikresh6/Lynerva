name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TURSO_DATABASE_URL: file:./ci.db
      TURSO_AUTH_TOKEN: ""
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret-1234
      CRON_SECRET: ci-only-cron-secret
      USE_MARKET_FIXTURES: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Verify real live NFL data
        run: npm run smoke:live
        env:
          USE_MARKET_FIXTURES: "false"
      - run: npm run build

  build_without_runtime_env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build with no runtime secrets
        run: npm run build
