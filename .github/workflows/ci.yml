name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TURSO_DATABASE_URL: file:./ci.db
      TURSO_AUTH_TOKEN: ""
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret-1234
      CRON_SECRET: ci-only-cron-secret
      USE_MARKET_FIXTURES: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify real live NFL data
        env:
          USE_MARKET_FIXTURES: "false"
          NODE_ENV: "production"
          LYNERVA_SMOKE_BASE_URL: "http://127.0.0.1:3000"
        run: |
          npm start > /tmp/lynerva-next.log 2>&1 &
          SERVER_PID=$!
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/live-nfl > /dev/null; then
              break
            fi
            sleep 1
          done
          npm run smoke:live || {
            cat /tmp/lynerva-next.log
            kill $SERVER_PID || true
            exit 1
          }
          kill $SERVER_PID || true

  build_without_runtime_env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build with no runtime secrets
        run: npm run build
