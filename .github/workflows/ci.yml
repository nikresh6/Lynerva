name: CI

on:
  push:
    branches:
      - main
      - fix/live-data-deploy
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TURSO_DATABASE_URL: file:./ci.db
      TURSO_AUTH_TOKEN: ""
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret-1234
      CRON_SECRET: ci-only-cron-secret
      USE_MARKET_FIXTURES: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Synchronize lockfile
        run: |
          npm install --package-lock-only --ignore-scripts
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Sync package lockfile"
            git push
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
